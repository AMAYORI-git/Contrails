// Adds the contrail module to every engine; in flight it decides by itself whether the engine is
// air-breathing: uses IntakeAir = yes; Advanced Jet Engine (AJE) engines = yes, except electric
// propellers; rockets = no. LAST runs after other mods (AJE etc.) have reworked the engines.
// The nozzle diameter is measured automatically; to override it for a part:
// @PART[part_name]:AFTER[Contrails] { @MODULE[ModuleContrail] { diameter = 1.25 } }
@PART[*]:HAS[@MODULE[ModuleEngines*],!MODULE[ModuleContrail]]:LAST[Contrails]
{
	MODULE
	{
		name = ModuleContrail
	}
}
