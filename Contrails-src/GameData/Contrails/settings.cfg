// Contrails settings. Read every time you enter flight.
// The Contrails toolbar window rewrites this file when you press Apply.
CONTRAILS
{
	mode = arcade           // arcade = War Thunder style; realistic = thin crisp lines that spread out like real contrails

	// --- shared by both modes ---
	minAltitude = 8000      // m above sea level, no contrails below
	maxAltitude = 13000     // m, no contrails above
	fadeBand = 300          // m, contrails fade in/out smoothly near the limits
	shadowOpacity = 0.25    // shadow darkness on ground and clouds, 0..1 (0 = no shadow)
	emitInterval = 0.1      // s between trail points (lower = smoother but heavier)
	particleQuality = 1     // particles mode: detail far away (higher = finer but heavier)
	particleSpacing = 0.3   // particles mode: distance between puffs, in contrail widths (lower = smoother)
	particleLayers = 3      // particles mode: layers per puff, 1..6 (more = more volume, heavier)

	// --- per mode ---
	ARCADE
	{
		lifetime = 50           // s, how long a contrail lasts
		growth = 3              // how many times wider than the engine at the end of its life
		opacity = 0.85          // density, 0..1
		gap = 0                 // s, clear gap behind the nozzle before vapour condenses (0.2 s = 50 m at 250 m/s)
		fadeIn = 0.5            // s, how long the contrail takes to go from invisible to full density
		particles = False       // True = draw vapour as cloud-like particles instead of a ribbon
	}
	REALISTIC
	{
		lifetime = 120          // s, how long a contrail lasts
		growth = 25             // how many times wider than the engine after ~10 s (doubles again by the end of its life)
		opacity = 0.95          // density, 0..1
		gap = 0.15              // s, clear gap behind the nozzle before vapour condenses (0.2 s = 50 m at 250 m/s)
		fadeIn = 1.5            // s, how long the contrail takes to go from invisible to full density
		particles = False       // True = draw vapour as cloud-like particles instead of a ribbon
	}
}
